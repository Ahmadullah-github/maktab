openapi: 3.0.3
info:
  title: Maktab Platform API
  version: 1.0.0
  description: Cloud-authoritative multi-tenant school management API
paths:
  /api/v1/auth/csrf:
    get:
      operationId: v1_auth_csrf_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/password/change:
    post:
      operationId: v1_auth_password_change_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/session/login:
    post:
      operationId: v1_auth_session_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/auth/session/logout:
    post:
      operationId: v1_auth_session_logout_create
      tags:
      - v1
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/token:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/revoke:
    post:
      operationId: v1_auth_token_revoke_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRevoke'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRevoke'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRevoke'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/capabilities:
    get:
      operationId: v1_capabilities_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
          description: ''
  /api/v1/health/live:
    get:
      operationId: v1_health_live_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
          description: ''
  /api/v1/health/ready:
    get:
      operationId: v1_health_ready_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
          description: ''
  /api/v1/me:
    get:
      operationId: v1_me_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/memberships:
    get:
      operationId: v1_memberships_list
      tags:
      - v1
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
          description: ''
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 32
        display_name:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
      required:
      - display_name
      - id
      - username
    Capabilities:
      type: object
      properties:
        membership:
          allOf:
          - $ref: '#/components/schemas/Membership'
          readOnly: true
        permissions:
          type: array
          items:
            type: string
        modules:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityModule'
      required:
      - membership
      - modules
      - permissions
    CapabilityModule:
      type: object
      properties:
        code:
          type: string
        actions:
          type: array
          items:
            type: string
      required:
      - actions
      - code
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Me:
      type: object
      properties:
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
          readOnly: true
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          readOnly: true
      required:
      - account
      - memberships
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        tenant_name:
          type: string
          readOnly: true
        school_unit_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        school_unit_name:
          type: string
          readOnly: true
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        roles:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          readOnly: true
      required:
      - id
      - roles
      - school_unit_id
      - school_unit_name
      - tenant_id
      - tenant_name
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    ServiceStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
      required:
      - status
    SessionLogin:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    StatusEnum:
      enum:
      - active
      - suspended
      - ended
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
        * `ended` - Ended
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRevoke:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
