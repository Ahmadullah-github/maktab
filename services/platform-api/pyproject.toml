[project]
name = "maktab-platform-api"
version = "0.1.0"
description = "Cloud-authoritative Maktab school platform API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "boto3>=1.39,<2",
  "celery[redis]>=5.5,<6",
  "django>=5.2,<5.3",
  "django-cors-headers>=4.7,<5",
  "django-environ>=0.12,<1",
  "django-filter>=25.1,<26",
  "django-storages[s3]>=1.14,<2",
  "djangorestframework>=3.17,<3.18",
  "djangorestframework-simplejwt>=5.5,<6",
  "drf-spectacular>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
]

[dependency-groups]
dev = [
  "django-stubs>=5.2,<6",
  "djangorestframework-stubs>=3.16,<4",
  "factory-boy>=3.3,<4",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

