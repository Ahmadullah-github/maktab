[project]
name = "maktab-timetable-solver"
version = "1.0.0"
description = "Offline constraint-based timetable solver"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ortools>=9.10.4067",
  "pydantic>=2.11.9",
  "pyyaml>=6.0",
  "redis>=5.0",
  "structlog>=25.4",
]

[dependency-groups]
dev = ["pyinstaller>=6.11", "pytest>=8.4,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
